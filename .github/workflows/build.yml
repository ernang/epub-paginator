name: Build macOS App

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller customtkinter

      - name: Build macOS App (.app)
        run: |
          pyinstaller --noconsole --windowed --collect-all customtkinter epub_paginador_gui.py

      - name: Create DMG
        run: |
          mkdir -p dmg_preparacion
          cp -r dist/epub_paginador_gui.app dmg_preparacion/
          ln -s /Applications dmg_preparacion/Applications
          hdiutil create -volname "EPUB Paginator" -srcfolder dmg_preparacion -ov -format UDZO EPUB_Paginator.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: EPUB_Paginator.dmg